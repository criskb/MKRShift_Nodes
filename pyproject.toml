description = "Creative direction, look development, finishing, utility, and workflow nodes for ComfyUI."
version = "1.0.1"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
optional-dependencies = { v3 = ["comfy_api>=0.0.2"] }
